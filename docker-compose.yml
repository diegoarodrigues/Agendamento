version: '3.9'
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: agendamento
      POSTGRES_USER: ag_user
      POSTGRES_PASSWORD: ag_pass
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
  adminer:
    image: adminer
    ports:
      - '8080:8080'
volumes:
  pgdata:
